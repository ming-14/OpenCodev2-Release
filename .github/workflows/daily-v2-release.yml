name: daily-v2-release

run-name: "opencode v2 mirror · run #${{ github.run_number }}"

# 跟随上游 anomalyco/opencode 的正式版 tag（v2.0.x）：有新 tag 就从 tag 指向的提交
# 构建 Windows 桌面版 + 终端版，以同名 tag 发布本仓库 Release（版本串与官方一致），
# 再把 tag 与提交写回 version.json 作为下一轮比对基准。详见 README。

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略版本号比对，强制重新构建并发布"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-v2-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: anomalyco/opencode
  UPSTREAM_BRANCH: v2
  # 与上游 .github/workflows/publish.yml 保持一致：编译进产物的 Bun 运行时版本
  BUN_VERSION: "1.4.2"
  BUN_COMPILE_RELEASE: bun-v1.4.2
  # prod → 桌面版 productName 为 "OpenCode"、appId 为 ai.opencode.desktop
  # 可改为 beta（"OpenCode Beta"）以避开与官方安装版的标识冲突
  OPENCODE_CHANNEL: prod
  # 每日镜像标记为预发布；改成 "false" 可让 GitHub 把最新一次构建显示为 Latest
  PRERELEASE: "true"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. 找上游最新正式版 tag（v2.0.x），与 version.json 比对，决定本轮是否构建
  # ─────────────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      version: ${{ steps.probe.outputs.version }}
      tag: ${{ steps.probe.outputs.tag }}
      stamp: ${{ steps.probe.outputs.stamp }}
      short_sha: ${{ steps.probe.outputs.short_sha }}
      desktop: ${{ steps.probe.outputs.desktop }}
      cli: ${{ steps.probe.outputs.cli }}
      sha: ${{ steps.probe.outputs.sha }}
      last_sha: ${{ steps.probe.outputs.last_sha }}
      upstream_tag: ${{ steps.probe.outputs.upstream_tag }}
      reason: ${{ steps.probe.outputs.reason }}
    steps:
      - name: Checkout (读取本仓库 version.json)
        uses: actions/checkout@v4

      - name: Probe upstream v2
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          pkgver() {
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/$UPSTREAM_REPO/contents/$1?ref=$RELEASE_TAG" --jq .version
          }

          # 官方正式版 tag 前缀 = $UPSTREAM_BRANCH + "."（即 v2.0.x 这类），
          # 由上游 publish.yml 打出，同时发布到 npm @opencode/cli
          # --paginate：tag 超过 30 个后默认只返回第一页（按 ref 名字典序），不翻页会漏掉新 tag；
          # awk：先按前缀归属本分支线，再校验完整 tag 是 vX.Y.Z
          #  （注意不能剥掉前缀后校验剩余部分：v2.0.16 剥 "v2." 只剩 "0.16"，两段会被误过滤）
          RELEASE_TAG="$(gh api --paginate "repos/$UPSTREAM_REPO/git/matching-refs/tags/$UPSTREAM_BRANCH." \
            --jq '.[].ref | sub("refs/tags/"; "")' \
            | awk -v p="$UPSTREAM_BRANCH." '
                index($0, p) == 1 {
                  t = $0; sub(/^v/, "", t)
                  if (t ~ /^[0-9]+\.[0-9]+\.[0-9]+$/) print $0
                }' \
            | sort -V | tail -n1)"
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::上游未找到任何 vX.Y.Z 形式的 tag"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"

          # tag 指向的提交不在 v2 分支线上（detached 提交），必须按 tag 解析 SHA
          TAG_COMMIT="$(gh api "repos/$UPSTREAM_REPO/commits/$RELEASE_TAG")"
          SHA="$(jq -r .sha <<<"$TAG_COMMIT")"
          # 用 tag 打出时间（committer date），同一 tag 重跑得到同一个 stamp
          STAMP="$(jq -r .commit.committer.date <<<"$TAG_COMMIT" | cut -c1-10 | tr -d '-')"
          SHORT="${SHA:0:7}"
          # tag 提交里的 package.json 已被 publish.ts 统一改写成该版本，作展示用
          DESKTOP="$(pkgver packages/desktop/package.json)"
          CLI="$(pkgver packages/cli/package.json)"

          LAST_TAG="" LAST_SHA=""
          if [ -f version.json ]; then
            # 比对基准用 upstream_tag（官方 tag 名），不用 release_tag ——
            # 后者在撞车时会带 .N 后缀，拿它比对会导致永远不相等、无限重建
            LAST_TAG="$(jq -r '.upstream_tag // .release_tag // ""' version.json)"
            LAST_SHA="$(jq -r '.commit // ""' version.json)"
          fi

          LAST_SHORT="${LAST_SHA:0:7}"

          echo "upstream : $RELEASE_TAG ($VERSION) -> $SHORT ($STAMP)  desktop=$DESKTOP cli=$CLI"
          echo "recorded : ${LAST_TAG:-<none>} @ ${LAST_SHORT:-<none>}"

          CHANGED=false REASON=""
          if [ "$FORCE" = "true" ]; then
            CHANGED=true
            REASON="手动 force，忽略 tag 比对"
          elif [ -z "$LAST_TAG" ]; then
            CHANGED=true
            REASON="首次构建"
          elif [ "$RELEASE_TAG" != "$LAST_TAG" ]; then
            CHANGED=true
            REASON="上游发布新 tag：$LAST_TAG → $RELEASE_TAG"
          elif [ "$SHA" != "$LAST_SHA" ]; then
            CHANGED=true
            REASON="tag $RELEASE_TAG 被 force 重推（$LAST_SHORT → $SHORT）"
          else
            REASON="tag $RELEASE_TAG 无变化"
          fi

          echo "decision : $REASON"

          TAG=""
          if [ "$CHANGED" = "true" ]; then
            # tag 与产物版本串都直接取官方号（后者去掉 v），与官方完全一致
            TAG="$RELEASE_TAG"
            # 本仓库已存在同名 Release（force 重跑 / tag 被重推）时追加运行编号避免撞车，
            # 版本串改挂到 prerelease 段，仍是合法 semver
            if gh release view "$TAG" >/dev/null 2>&1; then
              TAG="$TAG.$GITHUB_RUN_NUMBER"
              VERSION="$VERSION-mirror.$GITHUB_RUN_NUMBER"
            fi
          fi

          {
            echo "changed=$CHANGED"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "upstream_tag=$RELEASE_TAG"
            echo "stamp=$STAMP"
            echo "short_sha=$SHORT"
            echo "desktop=$DESKTOP"
            echo "cli=$CLI"
            echo "sha=$SHA"
            echo "last_sha=$LAST_SHA"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### opencode 正式版 tag 检查"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 上游最新 tag | \`$RELEASE_TAG\` |"
            echo "| tag 指向提交 | \`$SHORT\` |"
            echo "| 已构建 tag | \`${LAST_TAG:-—}\` |"
            echo "| 已构建提交 | \`${LAST_SHORT:-—}\` |"
            echo "| 上游 package.json | desktop \`$DESKTOP\` / cli \`$CLI\` |"
            echo ""
            if [ "$CHANGED" = "true" ]; then
              echo "**$REASON → 构建并发布 \`$TAG\`**（版本串 \`$VERSION\`）"
            else
              echo "**$REASON → 跳过本轮构建**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip notice
        if: steps.probe.outputs.changed != 'true'
        run: echo "::notice::${{ steps.probe.outputs.reason }}，后续构建任务全部跳过。"
  # ─────────────────────────────────────────────────────────────
  # 2. 终端版（CLI）：在 Linux 上用 Bun 交叉编译全部 Windows 目标
  # ─────────────────────────────────────────────────────────────
  build-cli:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build CLI
        run: bun ./packages/cli/script/build.ts
        env:
          BUN_COMPILE_RELEASE: ${{ env.BUN_COMPILE_RELEASE }}
          OPENCODE_VERSION: ${{ needs.check.outputs.version }}
          OPENCODE_CHANNEL: ${{ env.OPENCODE_CHANNEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Windows CLI builds
        run: |
          set -euo pipefail
          cd packages/cli/dist
          found=0
          for dir in cli-windows-*; do
            [ -d "$dir" ] || continue
            found=1
            ( cd "$dir" && zip -qr "$OLDPWD/opencode-$dir.zip" . )
          done
          if [ "$found" -eq 0 ]; then
            echo "no cli-windows-* artifacts produced" >&2
            exit 1
          fi
          ls -l opencode-cli-windows-*.zip

      - name: Upload CLI builds (供桌面版打包内嵌使用)
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-windows-dirs
          path: packages/cli/dist/cli-windows-*
          if-no-files-found: error
          retention-days: 1

      - name: Upload CLI archives (release 资产)
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-windows-zips
          path: packages/cli/dist/opencode-cli-windows-*.zip
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # 3. 桌面版（Electron）：Windows x64，未签名
  # ─────────────────────────────────────────────────────────────
  build-desktop:
    needs: [check, build-cli]
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1

      - name: Restore CLI builds
        uses: actions/download-artifact@v4
        with:
          name: opencode-cli-windows-dirs
          path: packages/cli/dist

      # CLI 是在 Linux 上用 Bun 交叉编译出来的，这里在真正的 Windows 上跑一次，
      # 确认二进制能执行且烧进去的版本号正确 —— 放在 bun install 之前，坏了能早退。
      - name: Smoke test cross-compiled CLI
        env:
          EXPECTED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # 自动探测 bin/ 下第一个 .exe（上游曾把命令名从 opencode2 改为 opencode，勿硬编码文件名）
          exe="$(find ./packages/cli/dist/cli-windows-x64/bin -maxdepth 1 -name '*.exe' | head -n1)"
          if [ -z "$exe" ]; then
            echo "::error::cli-windows-x64/bin 下未找到任何 .exe 可执行文件"
            ls -laR ./packages/cli/dist/cli-windows-x64 || true
            exit 1
          fi
          ls -l "$exe"
          actual="$(timeout 180 "$exe" --version | tr -d '\r\n')"
          echo "actual=[$actual]  expected=[$EXPECTED_VERSION]"
          # 版本串现在是 2.0.16 这种短串，子串匹配会误判（期望 2.0.1 能匹配到 2.0.16），
          # 所以要求 v<版本> 前后是非数字/非连字符边界：连字符也不能放行，
          # 否则期望 2.0.16 时，实际 2.0.16-mirror.43 这种注入不一致会被误判通过
          pattern="(^|[^0-9])v${EXPECTED_VERSION//./\\.}([^0-9-]|$)"
          if printf '%s' "$actual" | grep -qE "$pattern"; then
            echo "CLI version OK"
          else
            echo "::error::交叉编译的 CLI 版本号不匹配：实际 [$actual] 期望 [$EXPECTED_VERSION]"
            exit 1
          fi

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: Prepare (内嵌 CLI、图标、版本号)
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.check.outputs.version }}
          OPENCODE_CHANNEL: ${{ env.OPENCODE_CHANNEL }}
          OPENCODE_CLI_TARGET: x86_64-pc-windows-msvc
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Build renderer/main
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ needs.check.outputs.version }}
          OPENCODE_CHANNEL: ${{ env.OPENCODE_CHANNEL }}
          OPENCODE_CLI_TARGET: x86_64-pc-windows-msvc
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Package with electron-builder
        working-directory: packages/desktop
        run: npx electron-builder --win --x64 --publish never --config electron-builder.config.ts
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: ${{ env.OPENCODE_CHANNEL }}

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # 4. 发布 GitHub Release
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [check, build-cli, build-desktop]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.check.outputs.changed == 'true' &&
      needs.build-cli.result == 'success' &&
      needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 本任务不 checkout，gh 需要显式的仓库上下文
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
      SHA: ${{ needs.check.outputs.sha }}
      SHORT: ${{ needs.check.outputs.short_sha }}
      STAMP: ${{ needs.check.outputs.stamp }}
      LAST_SHA: ${{ needs.check.outputs.last_sha }}
      DESKTOP: ${{ needs.check.outputs.desktop }}
      CLI: ${{ needs.check.outputs.cli }}
      # PRERELEASE / UPSTREAM_REPO / UPSTREAM_BRANCH / OPENCODE_CHANNEL 由 workflow 级
      # env 自动注入到每个步骤，无需在这里重复声明（env 上下文在 job 级 env 中不可用）。
    steps:
      - name: Download desktop assets
        uses: actions/download-artifact@v4
        with:
          name: opencode-desktop-windows
          path: assets/desktop

      - name: Download CLI assets
        uses: actions/download-artifact@v4
        with:
          name: opencode-cli-windows-zips
          path: assets/cli

      - name: Write release notes
        run: |
          set -euo pipefail

          COMMITS=""
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" != "$SHA" ]; then
            COMMITS="$(gh api "repos/$UPSTREAM_REPO/compare/$LAST_SHA...$SHA" \
              --jq '.commits[] | "• `" + (.sha[0:7]) + "` " + (.commit.message | split("\n")[0])' 2>/dev/null || true)"
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="$(gh api "repos/$UPSTREAM_REPO/commits?sha=$UPSTREAM_BRANCH&per_page=30" \
              --jq '.[] | "• `" + (.sha[0:7]) + "` " + (.commit.message | split("\n")[0])')"
          fi

          {
            # 官方版本 = tag 去掉 v；不能用 $VERSION（撞车时会带 -mirror.N 后缀，npm 上没有）
            OFFICIAL="${UPSTREAM_TAG#v}"
            echo "本 Release 对应官方 tag [\`$UPSTREAM_TAG\`](https://github.com/$UPSTREAM_REPO/releases/tag/$UPSTREAM_TAG)（与 npm \`@opencode/cli@$OFFICIAL\` 同源同版本），从该 tag 指向的提交构建。"
            echo
            echo "- 上游 tag：\`$UPSTREAM_TAG\` → commit [\`$SHORT\`](https://github.com/$UPSTREAM_REPO/commit/$SHA)"
            echo "- 产物版本串：\`$VERSION\`（官方版本 \`$OFFICIAL\`，可与 \`npm i -g @opencode/cli@$OFFICIAL\` 对照）"
            echo "- 上游 package.json：desktop \`$DESKTOP\` / cli \`$CLI\`"
            echo "- 构建通道：\`$OPENCODE_CHANNEL\`"
            echo
            echo "### 产物"
            echo
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`opencode-desktop-win-x64.exe\` | 桌面版安装程序（Windows x64，未签名） |"
            echo "| \`opencode-cli-windows-x64.zip\` | 终端版（x64） |"
            echo "| \`opencode-cli-windows-x64-baseline.zip\` | 终端版（x64，无 AVX2 的老 CPU） |"
            echo "| \`opencode-cli-windows-arm64.zip\` | 终端版（ARM64） |"
            echo
            echo "> 终端版解压后得到 \`bin/opencode.exe\`，命令名为 \`opencode\`（上游自 2026-09-11 的 \`bb564f9\` 起由 \`opencode2\` 改名）。"
            echo
            echo "### 上游变更"
            echo
            echo "$COMMITS"
          } > notes.md
          cat notes.md

      - name: Create release
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          # 不传 --target：本仓库不包含上游 commit，标签应指向本仓库当前提交
          gh release create "$TAG" \
            "${flags[@]}" \
            --title "OpenCode $UPSTREAM_TAG (mirror) · ${STAMP:0:4}-${STAMP:4:2}-${STAMP:6:2} · $SHORT" \
            --notes-file notes.md \
            assets/desktop/* \
            assets/cli/*.zip

      - name: Summary
        run: |
          {
            echo "### ✅ 已发布 \`$TAG\`"
            echo
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo
            echo '```'
            gh release view "$TAG" --json assets --jq '.assets[].name'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # 5. 同步版本号：把本轮版本号写回本仓库 version.json
  # ─────────────────────────────────────────────────────────────
  sync-version:
    needs: [check, release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
      SHA: ${{ needs.check.outputs.sha }}
      DESKTOP: ${{ needs.check.outputs.desktop }}
      CLI: ${{ needs.check.outputs.cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update version.json
        run: |
          set -euo pipefail
          jq -n \
            --arg upstream "$UPSTREAM_REPO" \
            --arg branch "$UPSTREAM_BRANCH" \
            --arg desktop "$DESKTOP" \
            --arg cli "$CLI" \
            --arg commit "$SHA" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              upstream: $upstream,
              branch: $branch,
              desktop_version: $desktop,
              cli_version: $cli,
              commit: $commit,
              version: $version,
              upstream_tag: $upstream_tag,
              release_tag: $tag,
              release_url: $url,
              updated_at: $updated
            }' > version.json
          cat version.json

      - name: Commit & push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: sync v2 version to $TAG [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
